[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guangya-organizer"
version = "0.1.0"
description = "光鸭上传、Telegram 转存、本地和云盘整理；复用 MoviePilot 媒体引擎"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests[socks]>=2.32,<3",
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "jinja2>=3.1.6,<4",
  "oss2>=2.19,<3", "regex>=2024.11", "cn2an>=0.5,<1", "anitopy>=2.1,<3",
  "pinyin2hanzi>=0.1,<1", "moviepilot-rust==0.3.13", "pyyaml>=6,<7",
  "qrcode>=8,<9", "dateparser>=1.2,<2", "python-dateutil>=2.9,<3", "cachetools>=5,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["guangya*"]

[tool.setuptools.package-data]
guangya = ["web/*", "upstream.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["guangya/mp_core", "guangya/cloud_api.py", "guangya/cloud_client.py", "guangya/share_protocol.py"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
